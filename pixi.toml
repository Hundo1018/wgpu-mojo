[workspace]
authors = ["Tien-Chueh, Wang <f74169@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "wgpu-mojo"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.0"
preview = ["pixi-build"]

[package]
name = "wgpu-mojo"
version = "0.2.0"
authors = ["Tien-Chueh, Wang <f74169@gmail.com>"]
description = "Mojo bindings for wgpu-native"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Hundo1018/wgpu-mojo"


[package.build]
# Keep this range OPEN across backend minor lines. Each pixi-build-mojo release
# requires a specific `pixi-build-api-version` virtual package, and each pixi
# release provides exactly one: the 0.1.x line needs api-version >=4,<5 (pixi
# ~0.70), the 0.2.x line needs >=6,<7 (pixi >=0.72). Pinning a single minor
# ("0.1.*") therefore pins the *consumer's* pixi version too — with 0.1.* every
# `pixi add wgpu-mojo` on pixi >=0.72 failed with "could not initialize the
# build-backend ... no candidates were found". A range lets the solver pick the
# backend matching whichever pixi the consumer actually has.
backend = { name = "pixi-build-mojo",version = ">=0.1,<0.3" }


[package.build.config.pkg]
name = "wgpu"
path = "wgpu"
extra-args = ["-I", "."]

[package.build.config]
compilers = ["c","cxx","gcc"]

[package.host-dependencies]
mojo-compiler = ">=1.0.0,<2"

[package.build-dependencies]
mojo-compiler = ">=1.0.0,<2"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"

[activation]
# Make ffi/lib discoverable when running from the repo (dev mode).
# Conda-installed users rely on $CONDA_PREFIX/lib being in the search path.
env = { LD_LIBRARY_PATH = "ffi/lib:$CONDA_PREFIX/lib:$LD_LIBRARY_PATH", DYLD_LIBRARY_PATH = "ffi/lib:$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH" }

[dependencies]
mojo = ">=1.0.0,<2"
glfw = ">=3.4,<4"

# ---------------------------------------------------------------------------
# Opt-in: interop with Mojo's built-in GPU stack
# ---------------------------------------------------------------------------
# `max` ships the host-side half of Mojo's GPU stack (DeviceContext,
# DeviceBuffer, enqueue_function); `std.gpu` in the base `mojo` package only
# covers the kernel side. The core library deliberately does NOT depend on
# `max` -- see wgpu_max/interop.mojo for the reasoning. Confining it to a
# feature keeps the default environment, every `pixi run <task>`, and the
# published conda package free of it: only `pixi run -e maxinterop ...` pays.
[feature.maxinterop.dependencies]
max = ">=26.5,<27"

[feature.maxinterop.tasks]
test-max-interop    = { cmd = "mojo run -I . tests/test_max_interop.mojo", depends-on = ["build-callbacks"] }
example-max-interop = { cmd = "mojo run -I . examples/max_interop.mojo", depends-on = ["build-callbacks"] }
# Compile-check the opt-in package itself. `mojo precompile wgpu` cannot cover it
# (wgpu_max is not part of the wgpu package, by design), so this is its backstop.
check-compile-max   = { cmd = "bash scripts/check-compile-max.sh", depends-on = ["build-callbacks"] }

[environments]
maxinterop = ["maxinterop"]

[tasks]
# Build the C callback bridge (must be run before any GPU test/example)
build-callbacks = "bash scripts/build-callbacks.sh"
build-callback-probe = "mkdir -p ffi/lib && gcc -shared -fPIC -o ffi/lib/libmojo_callback_probe.so ffi/mojo_callback_probe.c -Wl,-rpath,'$ORIGIN'"

# Compile-check all tests (except abi_probes — intentional negative probes)
# and all examples. No GPU or libwgpu_native.so required; catches API drift at
# compile time. Run via: pixi run check-compile
check-compile = { cmd = "bash scripts/check-compile.sh", depends-on = ["build-callbacks", "build-callback-probe"] }
# Verify every wgpu-native symbol the binding resolves is exported by the .so.
# Catches ABI drift that check-compile cannot see (symbols resolve lazily).
check-symbols = { cmd = "bash scripts/check-symbols.sh" }
# Verify every FFI struct's byte size and field count against the real headers.
# The one correctness hole no other gate can see — a wrong layout silently
# corrupts every read through that struct.
check-struct-layout = { cmd = "python3 scripts/check_struct_layout.py" }
# Verify each FFI call's arity and void-ness against the header declaration.
# The last unmeasured surface: a wrong-arity call compiles, links, and corrupts.
check-signatures = { cmd = "python3 scripts/check_signatures.py" }

# Run all non-GPU tests
test = { cmd = "mojo run -I . tests/test_types.mojo && mojo run -I . tests/test_alloc_guard.mojo && mojo run -I . tests/test_handle_newtypes.mojo && mojo run -I . tests/test_lifetimes_string_view.mojo && mojo run -I . tests/test_structs.mojo && mojo run -I . tests/test_native_ext.mojo && mojo run -I . tests/test_callback_abi.mojo", depends-on = ["build-callbacks", "build-callback-probe"] }

# Run only non-GPU tests (no hardware required)
test-types       = { cmd = "mojo run -I . tests/test_types.mojo", depends-on = ["build-callbacks"] }
test-alloc-guard = { cmd = "mojo run -I . tests/test_alloc_guard.mojo", depends-on = ["build-callbacks"] }
test-handle-newtypes = { cmd = "mojo run -I . tests/test_handle_newtypes.mojo", depends-on = ["build-callbacks"] }
test-lifetimes-string-view = { cmd = "mojo run -I . tests/test_lifetimes_string_view.mojo", depends-on = ["build-callbacks"] }
test-structs     = { cmd = "mojo run -I . tests/test_structs.mojo", depends-on = ["build-callbacks"] }
test-native-ext  = { cmd = "mojo run -I . tests/test_native_ext.mojo", depends-on = ["build-callbacks"] }

# Run GPU-requiring tests individually
test-instance    = { cmd = "mojo run -I . tests/test_instance.mojo", depends-on = ["build-callbacks"] }
test-device      = { cmd = "mojo run -I . tests/test_device.mojo", depends-on = ["build-callbacks"] }
test-buffer      = { cmd = "mojo run -I . tests/test_buffer.mojo", depends-on = ["build-callbacks"] }
test-shader      = { cmd = "mojo run -I . tests/test_shader.mojo", depends-on = ["build-callbacks"] }
test-bind-group  = { cmd = "mojo run -I . tests/test_bind_group.mojo", depends-on = ["build-callbacks"] }
test-compute     = { cmd = "mojo run -I . tests/test_compute_pipeline.mojo", depends-on = ["build-callbacks"] }
test-texture     = { cmd = "mojo run -I . tests/test_texture.mojo", depends-on = ["build-callbacks"] }
test-texture-sample = { cmd = "mojo run -I . tests/test_texture_sample.mojo", depends-on = ["build-callbacks"] }
test-sampler     = { cmd = "mojo run -I . tests/test_sampler.mojo", depends-on = ["build-callbacks"] }
test-command     = { cmd = "mojo run -I . tests/test_command_encoder.mojo", depends-on = ["build-callbacks"] }
test-pipeline-layout = { cmd = "mojo run -I . tests/test_pipeline_layout.mojo", depends-on = ["build-callbacks"] }
test-error-scope    = { cmd = "mojo run -I . tests/test_error_scope.mojo",   depends-on = ["build-callbacks"] }
test-preflight      = { cmd = "mojo run -I . tests/test_preflight.mojo",     depends-on = ["build-callbacks"] }
test-add-ref        = { cmd = "mojo run -I . tests/test_add_ref.mojo",       depends-on = ["build-callbacks"] }
test-spirv          = { cmd = "mojo run -I . tests/test_spirv.mojo",         depends-on = ["build-callbacks"] }
test-log-bridge     = { cmd = "mojo run -I . tests/test_log_bridge.mojo",    depends-on = ["build-callbacks"] }
test-debug-groups   = { cmd = "mojo run -I . tests/test_debug_groups.mojo",  depends-on = ["build-callbacks"] }
test-query-set      = { cmd = "mojo run -I . tests/test_query_set.mojo",     depends-on = ["build-callbacks"] }
test-render-pipeline = { cmd = "mojo run -I . tests/test_render_pipeline.mojo", depends-on = ["build-callbacks"] }
test-gpu-compile    = { cmd = "mojo run -I . tests/test_gpu_compile.mojo",   depends-on = ["build-callbacks"] }
test-render-bundle  = { cmd = "mojo run -I . tests/test_render_bundle.mojo", depends-on = ["build-callbacks"] }

# Callback ABI test (non-GPU)
test-callback-abi   = { cmd = "mojo run -I . tests/test_callback_abi.mojo", depends-on = ["build-callback-probe"] }

# Hello Triangle quickstart
hello             = { cmd = "mojo run -I . hello.mojo", depends-on = ["build-callbacks"] }

# Examples
example-enumerate = { cmd = "mojo run -I . examples/enumerate_adapters.mojo", depends-on = ["build-callbacks"] }
example-compute   = { cmd = "mojo run -I . examples/compute_add.mojo", depends-on = ["build-callbacks"] }
example-clear     = { cmd = "mojo run -I . examples/clear_screen.mojo", depends-on = ["build-callbacks"] }
example-triangle  = { cmd = "mojo run -I . examples/triangle_window.mojo", depends-on = ["build-callbacks"] }
example-input     = { cmd = "mojo run -I . examples/input_demo.mojo", depends-on = ["build-callbacks"] }
example-texture-sample = { cmd = "mojo run -I . examples/texture_sample.mojo", depends-on = ["build-callbacks"] }
example-native-extensions = { cmd = "mojo run -I . examples/native_extensions.mojo", depends-on = ["build-callbacks"] }
example-fire-sim  = { cmd = "mojo run -I . examples/fire_simulation.mojo", depends-on = ["build-callbacks"] }
example-plasma    = { cmd = "mojo run -I . examples/plasma.mojo", depends-on = ["build-callbacks"] }
example-metaballs = { cmd = "mojo run -I . examples/metaballs.mojo", depends-on = ["build-callbacks"] }
example-raymarch  = { cmd = "mojo run -I . examples/raymarch.mojo", depends-on = ["build-callbacks"] }
# Headless: render showcase frames on the GPU + assemble README GIFs (needs a GPU).
render-gifs = { cmd = "mojo run -I . tools/render_shader_gif.mojo && bash scripts/make-gifs.sh", depends-on = ["build-callbacks"] }

# New Layer 3 GPU facade examples
example-compute-v2 = { cmd = "mojo run -I . examples/compute_add_v2.mojo", depends-on = ["build-callbacks"] }
examples-input    = { cmd = "pixi run example-input" }

# Linked binary builds (Phase 3 groundwork)
build-hello-linked = { cmd = "mkdir -p build && mojo build -I . hello.mojo -o build/hello-linked -Xlinker -Lffi/lib -Xlinker -lwgpu_native -Xlinker -lwgpu_mojo_cb -Xlinker -rpath -Xlinker '$ORIGIN/../ffi/lib'", depends-on = ["build-callbacks"] }
build-compute-linked = { cmd = "mkdir -p build && mojo build -I . examples/compute_add.mojo -o build/compute-linked -Xlinker -Lffi/lib -Xlinker -lwgpu_native -Xlinker -lwgpu_mojo_cb -Xlinker -rpath -Xlinker '$ORIGIN/../ffi/lib'", depends-on = ["build-callbacks"] }
