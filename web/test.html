<!doctype html>
<html><head><meta charset="utf-8"><title>PENDING</title></head>
<body><canvas id="canvas" width="64" height="48"></canvas><pre id="log"></pre>
<script type="module">
// Automated check for scripts/test-web.sh: the result goes into document.title.
import { loadWasm } from './wgpu_loader.mjs';
import { startApp, captureFrame } from './wgpu_host.mjs';
import { impl } from './webgpu_impl.mjs';

// ?canvas-lost: headless Chrome destroys the GPUDevice right after a canvas is
// drawn to (a plain-JS page does the same), so pixel checks are skipped there.
const canvasLost = new URLSearchParams(location.search).has('canvas-lost');
const lines = [];
const log = (s) => { lines.push(s); document.getElementById('log').textContent = lines.join('\n'); };
const fail = (s) => { log('FAIL ' + s); document.title = 'FAIL ' + s; throw new Error(s); };
const frame = () => new Promise((r) => requestAnimationFrame(r));

try {
  if (!navigator.gpu) fail('no navigator.gpu');

  // 1. Compute + non-blocking read-back. First: headless Chrome loses its
  // GPU instance once the triangle draws to a canvas (see ?canvas-lost).
  const C = await loadWasm('./compute.wasm');
  const app = C.compute_start();
  if (!app) fail('compute_start');
  let st = 0, frames = 0;
  while ((st = C.compute_step(app)) === 0 && frames < 600) { frames++; await frame(); }
  if (st !== 1) fail('compute_step=' + st);
  const n = C.compute_len(app);
  let bad = 0;
  for (let i = 0; i < n; i++) if (C.compute_value(app, i) !== 3 * i) bad++;
  log(`compute: n=${n} mismatches=${bad} polls=${C.compute_polls(app)} frames=${frames}`);
  if (n !== 1024 || bad) fail('compute result');

  // 1b. Two mapAsync calls in one frame complete in call order (#19).
  const before = C.rt.cbLog.length;
  let two = 0;
  for (let i = 0; two === 0 && i < 600; i++) { two = C.compute_two_maps(app); if (two === 0) await frame(); }
  if (two !== 1) fail('compute_two_maps=' + two);
  const order = C.rt.cbLog.slice(before);
  log('two mapAsync callbacks ran in future order: ' + order);
  if (order.length !== 2 || order[0] >= order[1]) fail('mapAsync callback order ' + order);

  // 1c. JS must not re-enter wasm from a microtask (#19): the runtime refuses.
  let reentry = null;
  await Promise.resolve().then(() => { try { C.rt.call_fn(1n); } catch (e) { reentry = e; } });
  log('re-entry from a microtask: ' + (reentry ? 'refused' : 'ALLOWED'));
  if (!reentry || !/re-entry/.test(reentry.message)) fail('microtask re-entry was not refused');

  // 1d. Every TextureFormat string is one the browser accepts (#18).
  const enums = await (await fetch('./webgpu_enum_strings.json')).json();
  const adapter = await navigator.gpu.requestAdapter();
  const dev = await adapter.requestDevice({ requiredFeatures: [...adapter.features] });
  const rejected = [];
  for (const f of Object.values(enums.TextureFormat)) {
    dev.pushErrorScope('validation');
    let t = null, threw = false;
    try { t = dev.createTexture({ size: [120, 120], format: f, usage: GPUTextureUsage.TEXTURE_BINDING }); }
    catch (e) { threw = true; }   // a TypeError: the browser does not know this format string at all
    const err = await dev.popErrorScope();
    t?.destroy();
    if (err || threw) rejected.push(f);
  }
  log(`texture formats: ${Object.keys(enums.TextureFormat).length} strings, rejected by this browser: ${rejected.join(',') || 'none'}`);
  // Formats a browser may lack for want of a feature; anything else rejected is a table bug.
  const KNOWN = /^(bc|etc2|eac|astc)|^(r|rg|rgba)16(unorm|snorm)$|^depth32float-stencil8$/;
  const unexpected = rejected.filter((f) => !KNOWN.test(f));
  if (unexpected.length) fail('texture format strings rejected: ' + unexpected);

  // 1e. Render-pass calls that carry data forward their arguments unchanged (#B2).
  {
    const rt = C.rt, calls = [];
    const rec = new Proxy({}, { get: (_, n) => (...a) => calls.push([n, ...a]) });
    const pass = rt.put({ kind: 'rpass', pass: rec });
    const buf = rt.put({ kind: 'buffer', buffer: 'BUF' });
    const bg = rt.put({ kind: 'bg', group: 'BG' });
    const WHOLE = 0xFFFFFFFFFFFFFFFFn;
    impl.wgpuRenderPassEncoderSetVertexBuffer(rt, pass, 2, buf, 16n, WHOLE);
    impl.wgpuRenderPassEncoderSetIndexBuffer(rt, pass, buf, 2, 8n, 64n);
    impl.wgpuRenderPassEncoderSetBindGroup(rt, pass, 1, bg, 0n, 0n);
    impl.wgpuRenderPassEncoderDrawIndexed(rt, pass, 6, 3, 1, -2, 4);
    const want = JSON.stringify([['setVertexBuffer', 2, 'BUF', 16, null], ['setIndexBuffer', 'BUF', 'uint32', 8, 64],
      ['setBindGroup', 1, 'BG', []], ['drawIndexed', 6, 3, 1, -2, 4]]);
    const got = JSON.stringify(calls.map((c) => c.map((x) => (x === undefined ? null : x))));
    log('render data calls: ' + got);
    if (got !== want) fail('render data calls forwarded wrongly: ' + got);
  }

  // 1f. QueueWriteBuffer hands the browser a view onto wasm memory, no JS copy (B3),
  // and the bytes still arrive.
  {
    const rt = C.rt, n = 64;
    const src = rt.alloc(n);
    for (let i = 0; i < n; i++) rt.u8[Number(src) + i] = (i * 7 + 1) & 0xFF;
    const seen = [];
    const spy = { writeBuffer: (b, o, d) => seen.push(d) };
    const spyQ = rt.put({ kind: 'queue', queue: spy }), spyB = rt.put({ kind: 'buffer', buffer: 'B' });
    impl.wgpuQueueWriteBuffer(rt, spyQ, spyB, 0n, src, BigInt(n));
    if (seen[0].buffer !== rt.view.buffer) fail('QueueWriteBuffer copied the data (not a view onto wasm memory)');

    const up = dev.createBuffer({ size: n, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    const rb = dev.createBuffer({ size: n, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    impl.wgpuQueueWriteBuffer(rt, rt.put({ kind: 'queue', queue: dev.queue }), rt.put({ kind: 'buffer', buffer: up }), 0n, src, BigInt(n));
    rt.u8.fill(0, Number(src), Number(src) + n);          // the source may change right after the call
    const enc = dev.createCommandEncoder();
    enc.copyBufferToBuffer(up, 0, rb, 0, n);
    dev.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const got = new Uint8Array(rb.getMappedRange());
    let bad = 0;
    for (let i = 0; i < n; i++) if (got[i] !== ((i * 7 + 1) & 0xFF)) bad++;
    log('QueueWriteBuffer without a JS copy: ' + n + ' bytes, mismatches=' + bad);
    if (bad) fail('QueueWriteBuffer bytes did not arrive');
    rt.free(src);
  }

  // 1d. A sampled texture: QueueWriteTexture per layer and mip level, CreateSampler (repeat), a 2D-array view.
  // Drawn into an app-owned target, so it runs before the canvas is touched (see ?canvas-lost).
  {
    const T = await loadWasm('./texture.wasm');
    const tapp = T.texture_start();
    if (!tapp) fail('texture_start');
    let ts = 0, tf = 0;
    while ((ts = T.texture_step(tapp)) === 0 && tf < 600) { tf++; await frame(); }
    if (ts !== 1) fail('texture_step=' + ts);
    const tpx = (x, y) => [0, 1, 2, 3].map((c) => T.texture_pixel(tapp, x, y, c)).join();
    const got = { 'layer 0 level 0': tpx(0, 0), 'layer 1 level 0': tpx(3, 0), 'layer 0 level 1': tpx(0, 1), 'layer 1 level 1': tpx(3, 1) };
    const want = { 'layer 0 level 0': '255,0,0,255', 'layer 1 level 0': '0,255,0,255', 'layer 0 level 1': '0,0,255,255', 'layer 1 level 1': '255,255,255,255' };
    log('texture: ' + Object.entries(got).map(([k, v]) => `${k}=${v}`).join(' ') + ` polls=${T.texture_polls(tapp)}`);
    for (const k of Object.keys(want)) if (got[k] !== want[k]) fail(`texture ${k}: got ${got[k]}, want ${want[k]}`);
  }

  // 2. Clear + triangle on a canvas, checked through the frame-capture hook.
  const canvas = document.getElementById('canvas');
  const host = await startApp(await loadWasm('./triangle.wasm'), canvas);
  for (let i = 0; host.M.wgpu_app_frames(host.app) < 3; i++) {
    if (host.error()) fail('frame loop: ' + host.error());
    if (i > 600) fail('no frame drawn after 600 animation frames');
    await frame();
  }
  log('triangle: 3 frames drawn');
  if (canvasLost) log('triangle: pixel checks skipped (canvas-lost)');
  else {
  // What the canvas shows, read through a 2D context.
  const c2 = new OffscreenCanvas(canvas.width, canvas.height).getContext('2d');
  c2.drawImage(canvas, 0, 0);
  const shown = (x, y) => Array.from(c2.getImageData(x, y, 1, 1).data);
  log(`canvas: corner=${shown(1, 1)} centre=${shown(32, 24)}`);
  if (shown(1, 1).join() !== '0,0,255,255') fail('canvas corner is not the clear colour: ' + shown(1, 1));
  if (shown(32, 24).join() !== '255,255,0,255') fail('canvas centre is not the triangle colour: ' + shown(32, 24));

  // The frame-capture hook (offscreen target, mapped without blocking).
  const cap = await captureFrame(host, canvas.width, canvas.height);
  const px = (x, y) => {
    const i = y * cap.pitch + x * 4, b = cap.bytes;
    // BGRA8Unorm = 0x1B, RGBA8Unorm = 0x16
    return cap.format === 0x1B ? [b[i + 2], b[i + 1], b[i], b[i + 3]] : [b[i], b[i + 1], b[i + 2], b[i + 3]];
  };
  const corner = px(1, 1), centre = px(32, 24);
  log(`triangle: format=0x${cap.format.toString(16)} corner=${corner} centre=${centre}`);
  if (corner.join() !== '0,0,255,255') fail('corner is not the clear colour (0,0,255,255): ' + corner);
  if (centre.join() !== '255,255,0,255') fail('centre is not the triangle colour (255,255,0,255): ' + centre);
  }

  // 3. DOM input reaches the Mojo InputState.
  canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: canvas.getBoundingClientRect().left + 17, bubbles: true }));
  await frame();
  const mx = host.M.wgpu_app_mouse_x(host.app);
  log(`input: mouse_x=${mx}`);
  if (mx !== 17) fail('mousemove did not reach InputState: ' + mx);

  log('PASS');
  document.title = 'PASS';
} catch (e) {
  if (!document.title.startsWith('FAIL')) { log('FAIL ' + e + '\n' + e.stack); document.title = 'FAIL ' + e; }
}
</script></body></html>
