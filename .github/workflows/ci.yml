name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Callback Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.0

      - name: Download libwgpu_native
        run: bash scripts/setup-native.sh

      - name: Build C callback bridges
        run: |
          pixi run build-callbacks
          pixi run build-callback-probe

  test:
    name: Non-GPU Test Suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.0

      - name: Download libwgpu_native
        run: bash scripts/setup-native.sh

      - name: Run non-GPU tests
        run: pixi run test

  compile-check:
    name: Compile-check All Tests & Examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.0

      - name: Download libwgpu_native
        run: bash scripts/setup-native.sh

      - name: Compile-check (GPU-free, catches API drift)
        run: pixi run check-compile

  test-gpu:
    name: GPU Tests (run locally with pixi run test-*)
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Note
        run: |
          echo "GPU tests require hardware and are run locally."
          echo "Use: pixi run test-buffer, pixi run test-compute, etc."
          echo "Or set up a self-hosted runner with GPU access."
