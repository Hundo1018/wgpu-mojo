name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
      - main
  # Stable-tracking auto-commits its pixi.lock bump with the default GITHUB_TOKEN, and
  # GitHub's anti-recursion rule means that push does NOT trigger this workflow.
  # Chain off Stable-tracking's completion instead so the auto-bumped lock still gets the
  # full macOS matrix + lavapipe coverage. See the `if:`/`ref:` notes below.
  workflow_run:
    workflows: ["Stable Mojo Tracking"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Non-GPU correctness on every supported platform.
  # Each job self-contains the native setup, so there is no shared "build" job
  # whose output has to be threaded through (the previous layout rebuilt the
  # bridge in every job anyway).
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    # On a workflow_run chain, only proceed if Stable-tracking actually succeeded —
    # a failed/cancelled stable-tracking run must not gate-open CI. (Always runs for push/PR.)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]   # linux-64 and osx-arm64 — the declared platforms
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # For workflow_run, checkout defaults to the workflow file's ref, NOT the
          # triggering run's commit — and the run's head_sha is the PRE-bump commit
          # anyway (stable-tracking commits *after* it starts). Check out the branch tip,
          # which is the freshly pushed auto-commit. Empty for push/PR → github.ref.
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          activate-environment: true   # exports CONDA_PREFIX/PATH so setup-native.sh works

      - name: Install wgpu-native + build C bridges
        run: bash scripts/setup-native.sh

      - name: Run non-GPU tests
        run: pixi run test

      - name: Compile-check all tests & examples (catches API drift)
        run: pixi run check-compile

      - name: Check FFI symbols resolve (catches wgpu-native ABI drift)
        run: pixi run check-symbols

      - name: Check FFI struct layouts against the C headers
        run: pixi run check-struct-layout

      - name: Check FFI call signatures against the C headers
        run: pixi run check-signatures

  # ---------------------------------------------------------------------------
  # Headless GPU tests on a free runner via Mesa lavapipe (software Vulkan).
  # No physical GPU and no display server are needed — only the compute/headless
  # paths run here. Windowed tests (triangle/fire/glfw) live in the self-hosted
  # GPU guide (docs/CI_CD.md).
  #
  # continue-on-error while we confirm lavapipe covers every feature these tests
  # use; flip to required once the job is consistently green.
  # ---------------------------------------------------------------------------
  gpu-software:
    name: Headless GPU (lavapipe)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}   # branch tip = auto-commit; see `test` job

      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1

      - name: Select lavapipe ICD
        run: |
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$LVP_ICD" ]; then
            echo "lavapipe ICD not found" >&2
            exit 1
          fi
          echo "Using lavapipe ICD: $LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - name: Show Vulkan adapter
        run: vulkaninfo --summary || true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          activate-environment: true

      - name: Install wgpu-native + build C bridges
        run: bash scripts/setup-native.sh

      - name: Run headless GPU tests
        run: |
          pixi run test-instance
          pixi run test-device
          pixi run test-buffer
          pixi run test-compute
          pixi run test-add-ref
          pixi run test-spirv
          pixi run test-log-bridge
          pixi run test-query-set
          pixi run test-render-pipeline

      # The documented examples, not just the tests. These are headless, so
      # lavapipe can run them. check-compile only ever compiled them, which is
      # how the README's headline example (compute_add_v2) came to be broken in
      # three separate ways while CI stayed green.
      - name: Run the headless examples the docs point newcomers at
        run: |
          pixi run example-enumerate
          pixi run example-compute
          pixi run example-compute-v2

  # ---------------------------------------------------------------------------
  # Opt-in wgpu <-> MAX bridge (wgpu_max/).
  #
  # Compile-check only, and deliberately a separate job: `max` is not in the
  # default environment, so none of the jobs above touch this code at all --
  # that isolation is the whole point of the opt-in design, and it also means
  # nothing else would catch API drift in the bridge.
  #
  # Scope, stated honestly. MAX compiles GPU code for the *building* machine's
  # accelerator and hard-errors when there is none -- so on a GitHub runner this
  # job compiles `wgpu_max` itself (catching syntax, type and import drift in
  # the bridge's definitions, e.g. `max.gpu.host` moving) but NOT the bridge
  # instantiated at a concrete dtype: the test and example elide their GPU
  # bodies behind `comptime if has_accelerator()`, which is exactly what lets
  # them compile here at all.
  #
  # Full instantiation and execution therefore only happen on a machine with a
  # real GPU, via `pixi run -e maxinterop test-max-interop`. Adding lavapipe
  # would not help: it is a software Vulkan rasterizer, which serves wgpu but
  # not MAX (MAX targets CUDA/ROCm/Metal and reports no accelerator).
  # ---------------------------------------------------------------------------
  max-interop:
    name: MAX interop (compile-check)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}   # branch tip = auto-commit; see `test` job

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: maxinterop
          activate-environment: maxinterop   # exports CONDA_PREFIX/PATH for setup-native.sh

      - name: Install wgpu-native + build C bridges
        run: bash scripts/setup-native.sh

      - name: Compile-check the bridge, its test and its example
        run: pixi run -e maxinterop check-compile-max
