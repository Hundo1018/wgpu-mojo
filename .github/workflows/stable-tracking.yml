name: Stable Mojo Tracking

# Runs weekly to test against the latest Mojo release from the stable `max`
# channel (switched from nightly tracking — see git history on this file for
# the prior nightly-tracking version).
# On success: auto-commits the updated pixi.lock so the repo always rides the
#             latest working stable Mojo release.
# On failure: opens/updates a tracking issue with the actual compiler errors
#             (not LSP output — the real compile+run errors are the source of truth).
#
# Can also be triggered manually via workflow_dispatch to test a specific release.

on:
  schedule:
    - cron: "17 6 * * 1"   # 06:17 UTC every Monday — stable releases ship far less often than nightlies
  workflow_dispatch:

concurrency:
  group: stable-tracking
  cancel-in-progress: true

permissions:
  contents: write        # to commit updated pixi.lock
  issues: write          # to open/update the tracking issue
  pull-requests: write   # to open a lock-bump PR

jobs:
  stable-check:
    name: Update to latest stable Mojo & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Self-healing: the failure-tracking steps below depend on this label
      # existing. If it's ever deleted, `gh issue create --label` hard-fails
      # and the failure silently produces no tracking issue at all — recreate
      # it unconditionally every run (no-op once it exists).
      - name: Ensure stable-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "stable-failure" \
            --description "Auto-filed by stable-tracking.yml when the stable Mojo tracking build breaks" \
            --color "b60205" 2>/dev/null || true

      - name: Setup Pixi (without locked env — we're about to update)
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          run-install: false

      - name: Update to latest stable Mojo
        id: update
        run: |
          pixi update 2>&1 | tee /tmp/pixi-update.log
          MOJO_VER=$(pixi run mojo --version 2>/dev/null || echo "unknown")
          echo "mojo_version=$MOJO_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved Mojo: $MOJO_VER"

      - name: Install updated environment
        run: pixi install

      - name: Download libwgpu_native + build C bridges
        run: pixi run bash scripts/setup-native.sh

      - name: Build C callback bridges
        run: |
          pixi run build-callbacks
          pixi run build-callback-probe

      - name: Run non-GPU tests
        id: test
        run: pixi run test

      - name: Compile-check all tests & examples
        id: compile_check
        run: pixi run check-compile

      # Extra signal: exercise a real GPU codepath against the new release via
      # software Vulkan. continue-on-error keeps this off the lock-bump gate.
      - name: Headless GPU smoke (lavapipe)
        id: gpu_smoke
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          export VK_ICD_FILENAMES="$LVP_ICD"
          export LIBGL_ALWAYS_SOFTWARE=1
          pixi run test-compute

      # --- SUCCESS PATH: commit the updated lock ---
      - name: Commit updated pixi.lock
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet pixi.lock; then
            echo "pixi.lock unchanged — already on latest stable Mojo."
          else
            git add pixi.lock
            git commit \
              -m "chore: bump pixi.lock to ${{ steps.update.outputs.mojo_version }}" \
              -m "Auto-committed by stable Mojo tracking workflow. All non-GPU tests and compile-checks passed."
            git push
          fi

      - name: Close stale stable-failure issue (if any)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --label "stable-failure" --state open --json number -q '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" \
              --comment "Stable Mojo ${{ steps.update.outputs.mojo_version }} passed all checks. Closing automatically."
          fi

      # --- FAILURE PATH: open/update a tracking issue ---
      - name: Collect failure logs
        if: failure()
        run: |
          {
            echo "## Stable Mojo tracking failure: ${{ steps.update.outputs.mojo_version }}"
            echo ""
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Errors (actual compiler output — not LSP)"
            echo '```'
            # Collect real compiler errors from the failed steps
            cat /tmp/pixi-update.log 2>/dev/null | tail -20 || true
            echo '```'
          } > /tmp/issue-body.md

      - name: Open or update stable-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --label "stable-failure" --state open --json number -q '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$OPEN"
          else
            gh issue create \
              --title "Stable Mojo tracking failure: ${{ steps.update.outputs.mojo_version }}" \
              --body-file /tmp/issue-body.md \
              --label "stable-failure"
            echo "Created new stable-failure issue"
          fi
